spring.application.name=documentservice

# Datasource wartet beim Start, bis DB verfügbar ist
spring.startup-checks.datasource=true

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=${PLUSER}
spring.datasource.password=${PLUSER_PASSWORD}
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update
server.port=8080
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka
#spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
#spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

kafka.topic.ocr=${KAFKA_TOPIC_OCR}
kafka.topic.result=${KAFKA_TOPIC_RESULT}

# Logging
logging.level.org.springframework.kafka=INFO
logging.level.com.example.documentservice=DEBUG

# MinIO
minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET}
